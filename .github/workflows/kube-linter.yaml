name: Tier 1 - kube-linter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kube-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Report-only phase (RHAI-51210): findings are visible in the SARIF
      # report but do not fail CI until they are triaged. Set to 'true' to
      # enforce the check set.
      KUBE_LINTER_FAIL_ON_FINDINGS: 'false'
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Lint manifests
        id: lint
        env:
          KUBE_LINTER_SARIF_DIR: ${{ runner.temp }}/kube-linter
        run: make lint-manifests
      - name: Upload kube-linter SARIF
        if: ${{ !cancelled() && steps.lint.outputs.sarif-ready == 'true' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/kube-linter/report.sarif
