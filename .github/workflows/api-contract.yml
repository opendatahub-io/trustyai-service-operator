name: API contract

# Static CRD compatibility check from red-hat-data-services/api-contract-tests.
# Compares the CRDs in a pull request with an immutable baseline commit and
# reports removed CRDs and API versions, served or storage-version changes,
# removed schema properties, newly required properties, type changes, enum
# narrowing and default changes. It does not replace conversion, admission or
# upgrade tests.
#
# This repository ships no OpenAPI or Swagger document, so there is no
# .rhoai/contracts.yaml and no OpenAPI job: coverage runs in CRD-only mode and
# the CRD globs below are the whole contract. A descriptor is added only if the
# repository starts shipping an OpenAPI document.
#
# One crd-contract job per glob, because the reusable workflow takes a single
# glob. Covered CRDs, generated by `make manifests`:
#   config/components/evalhub/crd/            trustyai.opendatahub.io/EvalHub
#   config/components/lmes/crd/               trustyai.opendatahub.io/LMEvalJob
#   config/components/nemo-guardrails/crd/    trustyai.opendatahub.io/NemoGuardrails
#   config/components/tas/crd/                trustyai.opendatahub.io/TrustyAIService
#   trustyai-operator-module/config/crd/bases/  components.platform.opendatahub.io/TrustyAI
#
# Not checked, with the reason next to each input below:
#   tests/crds/                               mocked CRDs used as test data
#   trustyai-operator-module/config/manifests-template/components/*/crd/
#                                             byte-identical copies of the
#                                             config/components CRDs
#
# The reusable workflows are pinned to the "latest" tag of api-contract-tests
# (v2.2.0 today), so new releases are adopted without a change here. See
# https://github.com/red-hat-data-services/api-contract-tests/blob/main/docs/releasing.md
# for the other pinning choices and how to upgrade.
#
# Baseline: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b, the commit the RHOAI 3.6
# release was based on (merge base of red-hat-data-services/trustyai-service-operator
# rhoai-3.6 and main, from release_baseline.py lookup --release 3.6, data
# generated 2026-11-09). Every CRD at that commit must stay compatible. The
# newest GA release tag, odh-3.6.0 (7056a0e8c89ff611ff0177719a2202cae49438da),
# ships byte-identical CRD manifests, so the baseline is also the released
# content. Moving it forward needs approval from someone other than the author.
#
# Runs on every pull request to main, with no path filter, so a CRD added
# anywhere reaches the coverage job.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  crd-contract-evalhub:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/components/evalhub/crd/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      mode: enforce

  crd-contract-lmes:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/components/lmes/crd/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      mode: enforce

  crd-contract-nemo-guardrails:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/components/nemo-guardrails/crd/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      mode: enforce

  crd-contract-tas:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/components/tas/crd/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      mode: enforce

  crd-contract-trustyai-module:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: trustyai-operator-module/config/crd/bases/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      mode: enforce

  crd-contract-coverage:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      # No contract-set input: without a descriptor the coverage check runs in
      # CRD-only mode and verifies every CRD manifest matches a glob below.
      crd-globs: >-
        config/components/evalhub/crd/*.yaml
        config/components/lmes/crd/*.yaml
        config/components/nemo-guardrails/crd/*.yaml
        config/components/tas/crd/*.yaml
        trustyai-operator-module/config/crd/bases/*.yaml
      # Deliberately unchecked, so a CRD must match a glob above unless it is
      # listed here.
      #   tests/crds: mocked CRDs used as test data, not shipped manifests.
      #   manifests-template/components/*/crd: byte-identical copies of the
      #   config/components CRDs, compared through those.
      crd-exclude-globs: >-
        tests/crds/*.yaml
        trustyai-operator-module/config/manifests-template/components/evalhub/crd/*.yaml
        trustyai-operator-module/config/manifests-template/components/lmes/crd/*.yaml
        trustyai-operator-module/config/manifests-template/components/nemo-guardrails/crd/*.yaml
        trustyai-operator-module/config/manifests-template/components/tas/crd/*.yaml
      baseline-refs: 3ecd158c38e7c3bcb844ee87a100427a96a9c88b # RHOAI 3.6 release base
      yq-version: "4.45.1"
      mode: enforce
